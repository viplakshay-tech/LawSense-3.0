name: LawSense quality gates

on:
  push:
    branches:
      - feature/unified-guide-chat
  pull_request:
    branches:
      - lawsense-3-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test legal knowledge client
        run: npm run test:api

      - name: Test official resource presentation
        run: npm run test:resources

      - name: Test Guide voice/presentation
        run: npm run test:guide

      - name: Test case session restoration
        run: npm run test:session-restoration

      - name: Build production frontend
        run: npm run build

  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run backend unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
