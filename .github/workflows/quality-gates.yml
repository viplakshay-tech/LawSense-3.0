name: LawSense quality gates

on:
  pull_request:
    branches:
      - lawsense-3-integration
  push:
    branches:
      - lawsense-3-integration
    paths:
      - "android/**"
      - "capacitor-shell/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/quality-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Android debug APK build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test the local Android connection shell
        run: node --test tests/android/connection-shell.test.mjs

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lawsense-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test legal knowledge client
        run: npm run test:api

      - name: Test official resource presentation
        run: npm run test:resources

      - name: Test Guide voice/presentation
        run: npm run test:guide

      - name: Test Legal Advisory live refresh
        run: npm run test:advisory

      - name: Test case session restoration
        run: npm run test:session-restoration

      - name: Build production frontend
        run: npm run build

  browser-e2e:
    name: Playwright browser flows against a disposable local API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r api/requirements.txt

      - name: Install isolated Playwright harness
        run: npm ci
        working-directory: tests/browser-e2e

      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
        working-directory: tests/browser-e2e

      - name: Configure disposable API source and request boundary
        shell: bash
        run: |
          echo "LAWSENSE_API_ROOT=$GITHUB_WORKSPACE/api" >> "$GITHUB_ENV"
          echo "LAWSENSE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "LAWSENSE_E2E_ALLOW_LOCAL_API=1" >> "$GITHUB_ENV"
          echo "LAWSENSE_ALLOWED_API_HOSTS=127.0.0.1:8001" >> "$GITHUB_ENV"
          echo "LAWSENSE_ALLOWED_API_ORIGINS=http://127.0.0.1:3012" >> "$GITHUB_ENV"

      - name: Run real browser journeys
        run: npm test
        working-directory: tests/browser-e2e
        env:
          LAWSENSE_AUTH_TEST_BYPASS: "1"

  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run backend unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
        env:
          LAWSENSE_AUTH_TEST_BYPASS: "1"
