name: LawSense CI

on:
  push:
    branches:
      - lawsense-3-integration
      - feature/advisory-first-pass
      - feature/privacy-security-baseline
  pull_request:
    branches:
      - lawsense-3-integration

permissions:
  contents: read

concurrency:
  group: lawsense-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Legal knowledge tests
        run: npm run test:api
      - name: Official resource tests
        run: npm run test:resources
      - name: Guide presentation tests
        run: npm run test:guide
      - name: Guide case-context tests
        run: npm run test:guide-context
      - name: Case session restoration tests
        run: npm run test:session-restoration
      - name: Production build
        run: npm run build

  backend:
    name: Python API test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt pytest
      - name: Run backend tests
        working-directory: api
        env:
          PYTHONPATH: .:tests
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
